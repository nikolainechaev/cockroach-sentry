AWSTemplateFormatVersion: '2010-09-09'
Description: Cockroach Sentry - infrastructure stack

Resources:
  SnapshotBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'cockroach-sentry-snapshots-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

Outputs:
  BucketName:
    Description: S3 bucket for detection snapshots
    Value: !Ref SnapshotBucket